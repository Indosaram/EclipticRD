[package]
name = "tauri-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.cargo-all-features]
skip = true

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
erd-app = { path = "../erd-app" }
erd-decode = { path = "../erd-decode", features = ["ffmpeg"] }
erd-net = { path = "../erd-net" }
erd-proto = { path = "../erd-proto" }
tauri = { version = "2", default-features = false, features = ["wry"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[lib]
name = "tauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src-tauri/src/lib.rs"

[[bin]]
name = "tauri-shell"
path = "src-tauri/src/main.rs"
