[package]
name = "erd-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
erd-proto = { path = "../erd-proto" }
erd-net = { path = "../erd-net" }
erd-app = { path = "../erd-app", default-features = false }
erd-decode = { path = "../erd-decode", default-features = false }
erd-render = { path = "../erd-render" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
core-foundation = { version = "0.10", default-features = false }

[lib]
name = "erd_mobile"
crate-type = ["lib", "cdylib", "staticlib"]
