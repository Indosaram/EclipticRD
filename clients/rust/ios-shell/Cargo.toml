[package]
name = "maho-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.cargo-all-features]
skip = true

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = [] }

[dependencies]
maho-app = { path = "../maho-app", default-features = false }
maho-mobile = { path = "../maho-mobile" }
maho-net = { path = "../maho-net" }
maho-proto = { path = "../maho-proto" }
maho-render = { path = "../maho-render" }
tauri = { version = "2", default-features = false, features = ["wry"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
maho-decode = { path = "../maho-decode", default-features = false, features = ["ios-videotoolbox"] }
objc2 = "0.6"
objc2-foundation = "0.3"
core-foundation = { version = "0.10", default-features = false }

[target.'cfg(not(target_os = "ios"))'.dependencies]
maho-decode = { path = "../maho-decode", features = ["ffmpeg"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "maho_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "maho-ios"
path = "src/main.rs"
