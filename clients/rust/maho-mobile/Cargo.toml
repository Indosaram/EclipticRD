[package]
name = "maho-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
maho-proto = { path = "../maho-proto" }
maho-net = { path = "../maho-net" }
maho-app = { path = "../maho-app", default-features = false }
maho-decode = { path = "../maho-decode", default-features = false }
maho-render = { path = "../maho-render" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
core-foundation = { version = "0.10", default-features = false }

[lib]
name = "maho_mobile"
crate-type = ["lib", "cdylib", "staticlib"]
