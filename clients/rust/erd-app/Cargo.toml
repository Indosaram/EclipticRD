[package]
name = "erd-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
erd-proto = { path = "../erd-proto" }
erd-net = { path = "../erd-net" }
erd-decode = { path = "../erd-decode" }
erd-render = { path = "../erd-render" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
rustix.workspace = true
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "erd-client"
path = "src/bin/erd_client.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.1", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.1", default-features = false, features = ["NSArray", "NSString"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
