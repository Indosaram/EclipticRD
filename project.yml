name: EclipticRD
options:
  bundleIdPrefix: com.indo
  deploymentTarget:
    macOS: 13.0
targets:
  EclipticRD:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "AGENTS.md"
      - path: Sources/Shared
        excludes:
          - "AGENTS.md"
      - path: Sources/HostCore
        excludes:
          - "AGENTS.md"
      - path: Sources/ClientCore
        excludes:
          - "AGENTS.md"
      - path: Sources/Resources
        excludes:
          - "EclipticRD.entitlements"
    entitlements:
      path: Sources/Resources/EclipticRD.entitlements
      properties:
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    settings:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Resources/Info.plist
      properties:
        NSCameraUsageDescription: "Required for capturing screen and camera data."
        NSMicrophoneUsageDescription: "Required for capturing audio."
        NSAppleEventsUsageDescription: "Required to send inputs to the system."
        NSScreenCaptureDescription: "Required to capture the screen for remote desktop."
        NSAccessibilityUsageDescription: "Required for injecting mouse and keyboard events."
  TestCLI:
    type: tool
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "XCTests"
      - path: Sources/Shared
      - path: Sources/ClientCore
      - path: Sources/HostCore

  E2ETest:
    type: tool
    platform: macOS
    sources:
      - path: E2ETests
      - path: Sources/Shared
      - path: Sources/ClientCore
      - path: Sources/HostCore

  EclipticRDLogicTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests/XCTests
      - path: Sources/Shared

schemes:
  EclipticRDLogicTests:
    build:
      targets:
        EclipticRDLogicTests: all
    test:
      config: Debug
      targets:
        - EclipticRDLogicTests
  EclipticRD:
    build:
      targets:
        EclipticRD: all
    run:
      config: Debug
      preActions:
        - name: "Reset TCC Permissions"
          script: |
            # Reset TCC permissions so macOS re-prompts with fresh code signature
            tccutil reset ScreenCapture com.indo.EclipticRD 2>/dev/null || true
            tccutil reset Accessibility com.indo.EclipticRD 2>/dev/null || true
            tccutil reset InputMonitoring com.indo.EclipticRD 2>/dev/null || true
          provideBuildSettingsFrom: EclipticRD
