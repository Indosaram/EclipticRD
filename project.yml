name: EclipticRD
options:
  bundleIdPrefix: com.indo
  deploymentTarget:
    macOS: 13.0
targets:
  EclipticRD:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/HostCore
      - path: Sources/ClientCore
      - path: Sources/Resources
    settings:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Resources/Info.plist
      properties:
        NSCameraUsageDescription: "Required for capturing screen and camera data."
        NSMicrophoneUsageDescription: "Required for capturing audio."
        NSAppleEventsUsageDescription: "Required to send inputs to the system."
        NSScreenCaptureDescription: "Required to capture the screen for remote desktop."
        NSAccessibilityUsageDescription: "Required for injecting mouse and keyboard events."

  TestCLI:
    type: tool
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Shared
      - path: Sources/ClientCore
      - path: Sources/HostCore

  E2ETest:
    type: tool
    platform: macOS
    sources:
      - path: E2ETests
      - path: Sources/Shared
      - path: Sources/ClientCore
      - path: Sources/HostCore
